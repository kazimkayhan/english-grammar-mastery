title: "Which past tense?"
pillar: tenses
description: "Past simple, past continuous, past perfect or present perfect?"
root:
  q: "Is the time finished and stated (yesterday, in 2019, last week, when I was a child)?"
  options:
    - label: "Yes, a finished time"
      next:
        q: "How do you see the action?"
        options:
          - label: "One complete action or fact"
            next:
              answer: "Past simple"
              example: "I visited Herat in 2019. · She called me yesterday."
          - label: "In progress at that moment (background)"
            next:
              answer: "Past continuous"
              example: "At 8 p.m. I was cooking. · It was raining when I left."
          - label: "Earlier than another past event"
            next:
              answer: "Past perfect"
              example: "When I arrived, the film had already started."
    - label: "No, it connects to now"
      next:
        q: "What do you want to say?"
        options:
          - label: "Experience, news or a result now"
            next:
              answer: "Present perfect"
              example: "I've lost my keys! · Have you ever been to Paris?"
          - label: "How long an activity has continued up to now"
            next:
              answer: "Present perfect continuous"
              example: "I've been studying for two hours."
