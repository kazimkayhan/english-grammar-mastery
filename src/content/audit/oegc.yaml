note: "Advanced (prefix A-): full 'list of topics' (Sections 1-17 plus Part 2 'grammar beyond the sentence'), 2011 edition (ISBN 9780194313919 / 9780194420785 contents PDFs). Intermediate (prefix I-): the 'list of units' pages of an OUP Intermediate student sample (PDF metadata 2020, Updated Edition); the text layer is partly garbled, so Section 2 (present tenses, only the spelling/progressive/non-progressive items were legible), Section 8 (questions and negatives) and Section 10 (various structures with verbs) lists are incomplete, and Section 22 (spoken grammar) heading was reconstructed from its unit titles. Basic: NOT retrieved (the fdslive contents PDFs for the Basic ISBNs only contain the front-matter page numbers, not the unit list; flipbook/Scribd/dokumen.pub mirrors were blocked; archive.org holds no readable text). The OPG Basic audit covers the same A1-A2 ground. Items are unit/topic titles; they were not checked against the 2019 Updated Edition pages, which may differ slightly. 'Revise the basics' and 'more practice' / 'revision test' pages are not itemised."
