source: GIU
edition: "Murphy, Essential Grammar in Use 4th ed (2015, Supplementary Exercises contents); English Grammar in Use 5th ed (2019); Hewings, Advanced Grammar in Use 3rd ed (2013); contents pages fetched 2026-10-26"
retrieved_from:
  - "https://assets.cambridge.org/97811074/80612/frontmatter/9781107480612_frontmatter.pdf"
  - "https://assets.cambridge.org/97811084/57651/frontmatter/9781108457651_frontmatter.pdf"
  - "https://assets.cambridge.org/97811076/97386/frontmatter/9781107697386_frontmatter.pdf"
verified: true
note: "Real contents pages (Cambridge University Press frontmatter PDFs, text extracted with pypdf). Caveats: (1) Essential Grammar in Use: the frontmatter retrieved is that of the Supplementary Exercises volume (ISBN 978-1-107-48061-2, 'to accompany Essential Grammar in Use Fourth Edition', 185 exercises); its contents list the 4th-edition topic groups (exercise ranges), not the 115 numbered unit titles, so Essential items are topic groups and refs show exercise ranges. The frontmatter of the main book (ISBN 978-1-107-48055-1 and -48056-8) downloaded but its text layer could not be read. (2) Advanced Grammar in Use: a 4th edition (ISBN 978-1-108-92021-6, 2021, 105 units) exists, but its frontmatter returned 404 and cambridge.org returned 403, so the 3rd edition (2013, 100 units) was audited; the 4th edition adds five academic-grammar units that are NOT checked here. (3) English Grammar in Use 5th ed (2019) is the latest edition: units 1-145 plus appendices. Level convention: level is the lower bound of the book band (Essential A1, English B1, Advanced C1) because the books do not grade units; levelNote is only added when a mapped inventory point is 2+ levels above the top of the band (Essential A2, English B2, Advanced C2), since inventory points below the band are simply review content for that book. Related units are merged into one item where the contents list them as a range (e.g. 3-4)."
