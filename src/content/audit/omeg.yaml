source: OMEG
edition: "1st edition, Oxford University Press, 2011 (Bas Aarts); no later edition found"
retrieved_from:
  - "https://ia600105.us.archive.org/11/items/OxfordModernEnglishGrammar/Oxford%20Modern%20English%20Grammar_djvu.txt"
verified: true
note: "Items are the numbered section headings (levels 2.1 to 11.8.2, including most 4-level headings) read in the OCR full text of the book, whose contents page lists only chapters. Some headings were lost to OCR noise and are therefore missing (e.g. 3.6.3.1 Lexical verbs, 7.3.1.4, 5.2.3.x/5.5.2.x sub-headings, 8.2.1 ff. patterns, parts of 7.3.1.x, 3.2.2 intro), and OCR typos in two numbers were corrected (5.5.2 / 5.6.2 'Noun phrases functioning as pre-Head Adjunct' sub-headings are not itemised). OMEG is a descriptive academic grammar, so many headings are analysis terminology; those are marked outOfScope, the rest are mapped to the closest learner-level point(s). Chapter 1 is an overview that repeats the chapter titles and is not itemised separately."
