source: LEG
edition: "Longman English Grammar Practice for Intermediate Students (L. G. Alexander), Longman 1990 (11th impression 1998) - the units below. Companion reference book: Longman English Grammar (Alexander, ed. R. A. Close), Longman 1988, x + 374 pp. No later editions of either found."
retrieved_from:
  - "https://archive.org/details/longman-english-grammar-practice_202412 (OCR full text; printed Contents read)"
  - "https://archive.org/details/longmanenglishgr0000alex (Longman English Grammar 1988: record only; full text restricted)"
  - "https://vufind.katalog.k.utb.cz/Record/24045/Details (catalogue record for Longman English Grammar 1988; its TOC is an image only)"
verified: partial
note: "PARTIAL: the contents of the Practice book (chapters and unit titles) were read in full and are itemised below (one item per unit; refs are 'Chapter#unit-number-in-chapter' counted from the printed list because the OCR lost the unit numbers). The reference book Longman English Grammar (1988) could not be read: its archive.org text is access-restricted (403), the catalogue TOC is an image (cache.obalkyknih.cz link 404), and no web page listing its contents was found. The Practice book's chapter order (sentence, nouns, articles, pronouns, quantity, adjectives, adverbs, prepositions/particles/phrasal verbs, tenses, be/have/do, modals, passive/causative, questions/answers/negatives, conditionals, direct/indirect speech, infinitive and -ing) follows the reference book, so reference-book coverage is only indirectly checked."
