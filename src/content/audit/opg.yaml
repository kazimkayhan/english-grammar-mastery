verified: partial
note: "All three levels in one file; refs are prefixed B (Basic, 109 units + 4 appendices), I (Intermediate, 153 units + 6 appendices) and A (Advanced, 17 chapters with their unit titles). Items are unit titles only (OPG contents pages list no finer headings). The 2019 Revised Edition contents pages could not be retrieved (OUP ELT site not reachable from here); the older contents were used. Evidence the structure is stable: the 2019 'Advanced Tests' book lists the same 17 chapters as the earlier Advanced contents, and the 1999 second edition of the Intermediate book (153 units, read in full, archive.org OPGwAPdfbooksfree.pk) matches the 2006 Intermediate list apart from small wording changes (e.g. units 95 and 150). Treat 2019 Basic/Intermediate unit titles as unverified."
