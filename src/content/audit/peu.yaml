note: "Items are the entry headings of the Contents overview (pp. xiii-xix) of a full 751-page scan of the 4th edition (c) Michael Swan 2016: grammar Sections 1-28 = entries 1-320; vocabulary Sections 29-30 = entries 321-351 (only grammar-relevant ones mapped, the rest marked outOfScope); plus the grammar-related entries of the A-Z Section 31 (entries 352-635), whose headings were read in the body of the book. Purely lexical A-Z entries (big/large/great, city/town, lay/lie, etc.) are deliberately not listed. No edition newer than the 4th (2016) was found. Mapping is strict at entry level but PEU entries are often broader than one inventory point, so several ids are listed per entry."
