source: CGEL
edition: "1985, Longman (Quirk, Greenbaum, Leech, Svartvik; index by David Crystal), 1779 pp. Only edition; no later Longman edition exists (Wikipedia/catalogue listings)."
retrieved_from:
  - "https://archive.org/details/a-comprehensive-grammar-of-the-english-languagepdf_compress (OCR full text; chapter list from Contents, and the chapter-opening section lists)"
  - "https://en.wikipedia.org/wiki/A_Comprehensive_Grammar_of_the_English_Language (publication details)"
verified: partial
note: "The OCR text of the 1985 book was read. The printed Contents lists chapters only (19 chapters + 3 appendices: 1 English language, 2 Survey of English grammar, 3 Verbs and auxiliaries, 4 Semantics of the verb phrase, 5 Nouns and determiners, 6 Pronouns and numerals, 7 Adjectives and adverbs, 8 Semantics and grammar of adverbials, 9 Prepositions, 10 The simple sentence, 11 Sentence types and discourse functions, 12 Pro-forms and ellipsis, 13 Coordination, 14 The complex sentence, 15 Syntactic and semantic functions of subordinate clauses, 16 Complementation of verbs and adjectives, 17 The noun phrase, 18 Theme, focus and information processing, 19 From sentence to text; App I Word-formation, App II Stress/rhythm/intonation, App III Punctuation). Section headings below come from the section lists printed at the start of chapters; the OCR dropped most section numbers, so refs are 'chN: heading'. PARTIAL: the section lists for chapters 4 (modals and later), 5 (number/gender/genitive/pronoun-like), 10 (first half), 11 (first half), 16 (second half), 17 and 18 (most) were not recovered cleanly from the OCR and are NOT itemised; Appendix III (punctuation) not read. Headings shortened; nothing here is invented from memory, but coverage of those unread sections remains unaudited."
