source: OGEG
edition: "John Eastwood, Oxford Guide to English Grammar, Oxford University Press, first published 1994 (paperback ISBN 0 19 431351 4 = 9780194313513; hardback 0 19 431334 4), seventh impression 2002; 446 pages, 40 chapters, 308 numbered sections. No newer edition was found; the book has not been revised since 1994."
retrieved_from:
  - "http://fdslive.oup.com/www.oup.com/elt/catalogue/pdf/contents_pages/grammar/9780194313513.pdf (HTTP 404, not readable)"
  - "https://elib.duytan.edu.vn/Sach/Index/2/4444 (only the seven part titles)"
  - "Contents page, chapter summaries and section headings of the 1994 book (7th impression 2002), read from a copy of the book (no official online contents page exists)"
verified: true
note: "Section-level list read from the full text of the 1994 book (7th impression 2002). Each chapter's opening 'Summary' section (e.g. 1, 7, 15, 21 ...) is not itemised because it only previews the chapter's other sections; all other numbered sections 2-308 are listed (267 items). Section titles were extracted from the scan's text layer; a few were recovered from cross-reference lines and 123 and 237 were completed from context (Adjective + to-infinitive, Noun + preposition). Section 54 (stress and intonation) is the only item marked out of scope; sections 55 (weak/short forms) and 56 (punctuation) are mapped to the contraction and punctuation points."
