note: "Items are the 447 Can-do grammar learning objectives in the 'GSE Learning Objectives: Grammar - Adult Learners' PDF (General Adult set; the Academic and Professional grammar sets were not retrieved). Text was extracted with pypdf from the downloaded PDF; one objective sentence is kept per item. Levels are derived from the GSE value printed in the PDF using Pearson's scale (A1 22-29, A2 30-42, B1 43-58, B2 59-75, C1 76-84). The adult guide stops at GSE 80 (C1); there are no C2 objectives. Where an objective is only partly covered by existing points, the item is mapped and also carries a suggest block. levelNote is added when any mapped inventory point is 2+ CEFR levels away from the GSE level; GSE rates productive use and places some structures (e.g. adverb comparatives, because of, state-change verbs) lower than classroom syllabi. Items sharing a suggested title are one proposed point."
