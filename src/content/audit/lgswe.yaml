source: LGSWE
edition: "2021, John Benjamins (redesign of the 1999 Longman edition). TOC actually read: 1999 Longman first edition (scan on archive.org). The 2021 TOC could not be retrieved."
retrieved_from:
  - "https://archive.org/details/EnglishLongmanGrammarOfSpokenAndWrittenEng (full text of 'Contents in detail', pp. xi-xxv, 1999 Longman edition)"
  - "https://www.torrossa.com/de/resources/an/5242297 (2021 edition: bibliographic record only, no TOC)"
  - "https://linguistlist.org/issues/32/1432/ (2021 edition announcement: description only, no TOC)"
verified: partial
note: "Benjamins catalogue (403), JBE platform (403) and De Gruyter Brill (405) blocked automated fetches, so the 2021 contents list was not read. The items below are the section and sub-section headings of the 1999 Longman Grammar of Spoken and Written English, read from the OCR text of 'Contents in detail'. The 2021 Benjamins edition is described by the publisher as a redesign of the same book, but its chapter structure is NOT verified here. Headings are shortened. Corpus-frequency sub-sections (the many 'distribution' and 'register distribution' headings) are collapsed into outOfScope items. Section numbers come from OCR and some sub-sub-numbers may be slightly off."
