source: CI
edition: "British Council / EAQUALS Core Inventory for General English (North, Ortega, Sheehan, 2010; the only published edition found, file pub-british-council-eaquals-core-inventoryv2.pdf), accessed 2026-10-26"
retrieved_from:
  - "https://www.teachingenglish.org.uk/article/british-council-eaquals-core-inventory-general-english"
  - "https://www.teachingenglish.org.uk/sites/teacheng/files/media/documents/pub-british-council-eaquals-core-inventoryv2.pdf"
verified: true
note: "Items come from Appendix E 'Exponents for Language Content' (A1 to C1) of the Core Inventory PDF: the numbered grammar headings (Questions, Verb forms, Modals, Nouns, Pronouns, Prepositions, Articles, Determiners, Adjectives, Adverbs, Intensifiers) plus Connecting words / Linkers / Discourse markers. Text extracted with pypdf. Each heading is listed once at the level where it first appears and again when a new sub-heading appears at a later level; items repeated unchanged at higher levels are not duplicated. The inventory has no C2 level. Functions/notions, Lexis and Topics sections were deliberately not listed (not grammar). Some CI sub-headings under Questions (numbers 60-62) were not extracted as separate headings by the PDF text layer, so Questions is covered by CI 59, 61 and 62 only. Sub-items are marked italic (less core) in the PDF; that distinction is not preserved in the text layer."
